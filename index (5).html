<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TalkCord</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--rail:#dfe1e6;--side:#eef0f3;--main:#fbfbfd;--text:#25282d;--muted:#667085;--hover:#dde0e6;--input:#e6e8ed;--accent:#5b5fe8;--onaccent:#fff;--line:#d5d8de;--c-owner:#9333ea;--c-mod:#15803d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--rail:#16171b;--side:#1d1f24;--main:#24262c;--text:#e8e9ec;--muted:#9aa0ab;--hover:#2d3037;--input:#2f323a;--accent:#7a7ef0;--onaccent:#10111a;--line:#33363e;--c-owner:#c084fc;--c-mod:#4ade80}}
:root[data-theme="dark"]{color-scheme:dark;--rail:#16171b;--side:#1d1f24;--main:#24262c;--text:#e8e9ec;--muted:#9aa0ab;--hover:#2d3037;--input:#2f323a;--accent:#7a7ef0;--onaccent:#10111a;--line:#33363e;--c-owner:#c084fc;--c-mod:#4ade80}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--main);color:var(--text);font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:68px 232px 1fr;height:100%}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;overflow-y:auto}
.srv{width:46px;height:46px;border-radius:50%;background:var(--side);font-size:22px;transition:border-radius .15s,background .15s;position:relative}
.srv:hover,.srv.on{border-radius:14px;background:var(--accent)}
.srv.on::before{content:"";position:absolute;left:-11px;top:12px;width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--text)}
.side{background:var(--side);display:flex;flex-direction:column;min-width:0}
.side h2{margin:0;padding:14px 14px;font-size:16px;border-bottom:1px solid var(--line)}
.chs{flex:1;overflow-y:auto;padding:8px}
.lbl{color:var(--muted);font-size:12px;font-weight:700;padding:8px 8px 4px}
.ch{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:6px;color:var(--muted)}
.ch:hover{background:var(--hover);color:var(--text)}
.ch.on{background:var(--hover);color:var(--text);font-weight:700}
.newch{width:100%;margin-top:6px;padding:6px 8px;border-radius:6px;border:1px dashed var(--line);background:transparent}
.me{display:flex;align-items:center;gap:8px;padding:10px;background:var(--rail)}
.me input{background:var(--input);border:0;border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.top .sp{flex:1}
.top button{padding:4px 10px;border-radius:6px;background:var(--input)}
#menu{display:none}
.msgs{flex:1;overflow-y:auto;padding:12px 16px}
.msg{display:flex;gap:12px;padding:6px 0}
.msg b{margin-right:8px}
.msg time{color:var(--muted);font-size:12px}
.msg p{margin:2px 0 0;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:24px 0}
.box{padding:0 16px 16px}
.box input{width:100%;padding:12px 14px;border:0;border-radius:8px;background:var(--input)}
.brand{font-weight:800;font-size:18px;letter-spacing:-.5px;color:var(--accent);padding:4px 0 6px}
.me .who{flex:1;min-width:0;line-height:1.2}
.me .who b,.me .who small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .who small{color:var(--muted);font-size:12px}
.me .ic{padding:6px 8px;border-radius:6px}
.me .ic:hover{background:var(--hover)}
.msg.compact{padding:2px 0}
.msg.compact .av{width:24px;height:24px;font-size:12px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--main);color:var(--text);padding:0;width:min(440px,94vw);max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
.tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{color:var(--text);border-color:var(--accent)}
.pane{padding:14px;display:grid;gap:12px}
.pane[hidden]{display:none}
.pane label{display:grid;gap:4px;font-weight:700;font-size:13px}
.pane input[type=text],.pane textarea,.pane select{background:var(--input);border:0;border-radius:6px;padding:8px;font-weight:400}
.pane textarea{resize:vertical;min-height:64px}
.pane .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw{display:flex;gap:8px;margin-top:6px}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.sw button.on{border-color:var(--text)}
.card{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;background:var(--side)}
.card .av{width:56px;height:56px;font-size:24px}
.card small{display:block;color:var(--muted)}
.foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.foot button,.danger{padding:8px 14px;border-radius:6px;background:var(--input)}
.foot .pri{background:var(--accent);color:var(--onaccent)}
.danger{color:#d64545}
.gbtn{margin-top:8px;padding:10px 16px;border-radius:8px;background:var(--accent);color:var(--onaccent);font-weight:700}
.pane input[type=password]{background:var(--input);border:0;border-radius:6px;padding:8px}
.pane .plain{padding:8px 14px;border-radius:6px;background:var(--input);text-align:left}
.nm-owner{color:var(--c-owner)}.nm-mod{color:var(--c-mod)}
.vf{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:11px;margin-right:6px;vertical-align:1px}
.tag{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:8px;color:var(--muted)}
.rx{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{padding:2px 10px;border-radius:8px;background:var(--input);border:1px solid transparent;font-size:14px}
.chip.me{border-color:var(--accent);background:var(--hover)}
.top button.on{background:var(--accent);color:var(--onaccent)}
.top input{background:var(--input);border:0;border-radius:6px;padding:4px 8px;width:120px;min-width:0}
.ban{height:90px;background:var(--accent) center/cover}
.tag.plus{color:var(--accent);border-color:var(--accent)}
.msg.gift{background:var(--hover);border-radius:10px;padding:8px}
.pane input[type=file]{font-size:13px}
.quote{color:var(--muted);font-size:13px;border-left:3px solid var(--line);padding-left:8px;margin-top:2px}
.msg.mention{background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:8px;padding:6px}
.mt{background:var(--hover);border-radius:4px;padding:0 3px;color:var(--accent)}
.msg a{color:var(--accent)}.msg p b{margin:0}
code{background:var(--input);border-radius:4px;padding:0 4px}
.pic{display:block;max-width:min(100%,320px);border-radius:8px;margin-top:6px}
.inrow{display:flex;gap:8px}.inrow button{padding:0 12px;border-radius:8px;background:var(--input)}
#rbar{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:6px 4px}
#rbar[hidden]{display:none}
@media (max-width:720px){
.app{grid-template-columns:60px 1fr}
.side{display:none;grid-column:2}
.app.open .side{display:flex}
.app.open .main{display:none}
#menu{display:inline-block}
}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Servers"></nav>
  <aside class="side">
    <h2 id="sname"></h2>
    <div class="chs"><div class="lbl">Text channels</div><div id="chs"></div>
      <input class="newch" id="newch" placeholder="+ New channel" maxlength="20" aria-label="New channel name">
    </div>
    <div class="me"><button class="av" id="meav" aria-label="Edit profile"></button><div class="who"><b id="mename"></b><small id="mestat"></small></div><button class="ic" id="gear" aria-label="Settings">⚙</button></div>
  </aside>
  <main class="main">
    <div class="top"><button id="menu" aria-label="Show channels">☰</button><span id="chtitle"></span><span id="onl" style="color:var(--muted);font-weight:400;font-size:13px"></span><input id="q" placeholder="Search" hidden aria-label="Search messages"><span class="sp"></span><button id="bpin" aria-label="Pinned messages">📌</button><button id="bsr" aria-label="Search">🔍</button><button id="bmem" aria-label="Members">👥</button><button id="theme">Theme</button></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="box"><div id="rbar" hidden></div><div class="inrow"><button id="att" aria-label="Attach photo">📎</button><input id="in" placeholder="Send a message" autocomplete="off" aria-label="Message"><input type="file" id="fatt" accept="image/*" hidden></div></div>
  </main>
</div>
<dialog id="dlg" aria-label="Profile and settings">
 <div class="tabs"><button id="tp" class="on">Profile</button><button id="ts">Settings</button></div>
 <div class="pane" id="pp">
  <div class="ban" id="pban" hidden></div>
  <div class="card"><div class="av" id="pav"></div><div><b id="pn"></b><small id="pst"></small><small id="pab"></small></div></div>
  <label>Display name<input type="text" id="fn" maxlength="20"></label>
  <label>Status<input type="text" id="fs" maxlength="40" placeholder="What are you up to?"></label>
  <label>About me<textarea id="fa" maxlength="160"></textarea></label>
  <div class="row"><label>Avatar emoji<input type="text" id="fe" maxlength="4" style="width:90px"></label><label>Avatar color<input type="color" id="fc"></label></div>
  <label>Profile picture<input type="file" id="fimg" accept="image/*"></label>
  <button class="plain" id="rimg">Remove picture</button>
  <label>Banner (TalkCord Plus)<input type="file" id="fban" accept="image/*"></label>
  <label>Name color (TalkCord Plus)<input type="color" id="fnc"></label>
  <small id="fplus" style="color:var(--muted)"></small>
 </div>
 <div class="pane" id="sp" hidden>
  <label>Theme<select id="sth"><option value="auto">Match my device</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <div><b style="font-size:13px">Accent color</b><div class="sw" id="sw"></div></div>
  <label class="row"><span>Compact messages</span><input type="checkbox" id="sc"></label>
  <label class="row"><span>24-hour clock</span><input type="checkbox" id="sh"></label>
  <button class="plain" id="out">Sign out</button>
  <button class="danger" id="wipe">Reset local settings</button>
 </div>
 <div class="foot"><button id="dc">Cancel</button><button class="pri" id="ds">Save changes</button></div>
</dialog>
<dialog id="vd" aria-label="Profile">
 <div class="ban" id="vban"></div>
 <div class="pane">
  <div class="card"><div class="av" id="vav"></div><div><b id="vn"></b><small id="vst"></small></div></div>
  <div id="vab" style="color:var(--muted)"></div>
  <button class="gbtn" id="vgift">🎁 Gift TalkCord Plus</button>
  <div class="empty" id="vmsg" style="padding:0"></div>
 </div>
 <div class="foot"><button id="vc">Close</button></div>
</dialog>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const SERVERS=[
 {id:"hq",icon:"🏠",name:"Fan HQ",ch:["announcements","welcome","general","memes"]},
 {id:"game",icon:"🎮",name:"Game Night",ch:["lobby","clips"]},
 {id:"art",icon:"🎨",name:"Art Corner",ch:["showcase","feedback"]}
];
const KEY="talkcord-v2";
let st={srv:"hq",ch:"welcome"};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)st=Object.assign(st,x)}catch(e){}
st.set=Object.assign({theme:"auto",accent:"",compact:false,h24:false},st.set);
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const $=id=>document.getElementById(id);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function hue(n){let h=0;for(const ch of String(n)){h=(h*31+ch.charCodeAt(0))%360}return"hsl("+h+" 55% 42%)"}
var needLogin=false,fbUser=null,authErr="",emv="",pwv="";
let db=null,uid=null,canW=null,P={},R={},C=[],M=[],unsub=null,asked=false,tried=false,pal=null,pinsOnly=false,qs="",showMem=false,PL={},newImg,newBan,ncchg=false,replyTo=null,OL={};
const EMO=["👍","🔥","😂","❤️","🎉","👀","😭","✅","💎","🦄","🌈","🥳"];
function key(){return st.srv+"/"+st.ch}
function srv(){return SERVERS.find(s=>s.id===st.srv)||SERVERS[0]}
function chans(){return srv().ch.concat(C.filter(c=>c.srv===srv().id).map(c=>c.name))}
function prof(u){return P[u]||{}}
function pname(u){return prof(u).name||"New member"}
function pcolor(u){return prof(u).color||hue(u||"x")}
function pletter(u){return prof(u).emoji||pname(u)[0].toUpperCase()}
function renderRail(){const r=$("rail");r.replaceChildren();const br=el("div","brand","TC");br.title="TalkCord";r.appendChild(br);
 SERVERS.forEach(s=>{const b=el("button","srv"+(s.id===st.srv?" on":""),s.icon);b.title=s.name;b.setAttribute("aria-label",s.name);b.onclick=()=>{st.srv=s.id;st.ch=s.ch[0];save();render();watch()};r.appendChild(b)})}
function renderChs(){$("sname").textContent=srv().name;const l=chans();if(!l.includes(st.ch))st.ch=l[0];const c=$("chs");c.replaceChildren();
 l.forEach(n=>{const b=el("button","ch"+(n===st.ch?" on":""),"# "+n);b.onclick=()=>{st.ch=n;save();$("app").classList.remove("open");render();watch()};c.appendChild(b)})}
function canPost(){return canW!==false&&(key()!=="hq/announcements"||!!R[uid])}
function roomRef(){return db.collection("rooms").doc(st.srv+"_"+st.ch).collection("msgs")}
function react(x,i){if(i>=8&&!hasPlus(uid))return;const had=((x.r||{})["e"+i]||[]).includes(uid);pal=null;const F=firebase.firestore.FieldValue;
 roomRef().doc(x.id).update({["r.e"+i]:had?F.arrayRemove(uid):F.arrayUnion(uid)}).catch(()=>{})}
function hasPlus(u){const p=PL[u];return!!((p&&p.until&&p.until.toMillis&&p.until.toMillis()>Date.now())||(R[u]&&R[u].role==="owner"))}
function plusText(u){const p=PL[u];if(R[u]&&R[u].role==="owner")return"TalkCord Plus is included with your owner role.";if(hasPlus(u))return"TalkCord Plus is active until "+new Date(p.until.toMillis()).toLocaleDateString()+".";return"You don’t have TalkCord Plus. Ask a friend to gift you one!"}
function who(u){const r=R[u]||{};const f=document.createDocumentFragment();const b=el("b",r.role?"nm-"+r.role:null,pname(u));
 if(hasPlus(u)&&prof(u).nc)b.style.color=prof(u).nc;b.style.cursor="pointer";b.onclick=()=>openView(u);f.appendChild(b);
 if(r.verified)f.appendChild(el("span","vf","✓"));if(r.badge)f.appendChild(el("span","tag",r.badge));if(hasPlus(u))f.appendChild(el("span","tag plus","✦ PLUS"));return f}
function renderMsgs(){const m=$("msgs");m.replaceChildren();
 if(!db&&needLogin){m.appendChild(el("div","empty","Sign in to join the chat."));const g=el("button","gbtn","Sign in with GitHub");g.onclick=()=>window.signIn();m.appendChild(g);
  const f=el("div","pane");f.style.cssText="padding:16px 0;max-width:320px";f.appendChild(el("div","lbl","Or use email and password"));
  const em=el("input");em.type="text";em.placeholder="Email";em.value=emv;em.autocomplete="email";em.setAttribute("aria-label","Email");em.oninput=()=>{emv=em.value};
  const pw=el("input");pw.type="password";pw.placeholder="Password (6+ characters)";pw.value=pwv;pw.autocomplete="current-password";pw.setAttribute("aria-label","Password");pw.oninput=()=>{pwv=pw.value};
  const b1=el("button","plain","Sign in");b1.onclick=()=>window.emailAuth(false);const b2=el("button","plain","Create account");b2.onclick=()=>window.emailAuth(true);
  f.append(em,pw,b1,b2);m.appendChild(f);if(authErr)m.appendChild(el("div","empty",authErr));return}
 if(!db){m.appendChild(el("div","empty",tried?"Chat isn’t connected yet. Add your Firebase settings at the bottom of this file (see the setup steps).":"Connecting to chat…"));return}
 if(showMem){m.appendChild(el("div","lbl","Members: "+Object.keys(P).length));
  Object.keys(P).sort((a,b)=>online(b)-online(a)).forEach(u=>{const row=el("div","msg");const a=avEl(u);const b=el("div");const h=el("div");h.appendChild(el("span",null,online(u)?"🟢 ":"⚪ "));h.appendChild(who(u));b.appendChild(h);b.appendChild(el("p",null,prof(u).status||prof(u).about||""));row.append(a,b);m.appendChild(row)});return}
 let list=M;if(pinsOnly)list=list.filter(x=>x.pin);if(qs)list=list.filter(x=>(x.x||"").toLowerCase().includes(qs));
 if(!list.length)m.appendChild(el("div","empty",pinsOnly?"No pinned messages yet.":qs?"No messages match your search.":"No messages yet. Say hello!"));
 list.forEach(x=>{const row=el("div","msg"+(st.set.compact?" compact":"")+(x.g?" gift":""));const a=avEl(x.uid);
  const body=el("div");const h=el("div");h.appendChild(who(x.uid));if(x.pin)h.appendChild(el("span","tag","pinned"));if(x.ed)h.appendChild(el("span","tag","edited"));
  h.appendChild(el("time",null,new Date(x.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:!st.set.h24})));
  body.appendChild(h);if(x.rp)body.appendChild(el("div","quote","↪ "+x.rp.n+": "+x.rp.t));
  if(mentions(x.x))row.classList.add("mention");body.appendChild(fmt(x.x||""));
  if(x.im){const im=el("img","pic");im.src=x.im;im.alt="Shared photo";body.appendChild(im)}
  const rx=el("div","rx");
  EMO.forEach((e,i)=>{const arr=(x.r||{})["e"+i]||[];if(!arr.length)return;const c=el("button","chip"+(arr.includes(uid)?" me":""),e+" "+arr.length);c.onclick=()=>react(x,i);rx.appendChild(c)});
  const add=el("button","chip","☺+");add.setAttribute("aria-label","Add reaction");add.onclick=()=>{pal=pal===x.id?null:x.id;renderMsgs()};rx.appendChild(add);
  if(pal===x.id)EMO.forEach((e,i)=>{if(i>=8&&!hasPlus(uid))return;const c=el("button","chip",e);c.onclick=()=>react(x,i);rx.appendChild(c)});
  if(R[uid]){const pb=el("button","chip",x.pin?"Unpin":"Pin");pb.onclick=()=>roomRef().doc(x.id).update({pin:!x.pin}).catch(()=>{});rx.appendChild(pb)}
  const rb=el("button","chip","Reply");rb.onclick=()=>{replyTo={n:pname(x.uid),t:(x.x||"photo").slice(0,60)};rbar();$("in").focus()};rx.appendChild(rb);
  if(x.uid===uid){const eb=el("button","chip","Edit");eb.onclick=()=>{const t=prompt("Edit message",x.x);if(t&&t.trim())roomRef().doc(x.id).update({x:prep(t.trim()).slice(0,500),ed:true}).catch(()=>{})};rx.appendChild(eb)}
  if(x.uid===uid||R[uid]){const dl=el("button","chip","Delete");dl.onclick=()=>{if(confirm("Delete this message?"))roomRef().doc(x.id).delete().catch(()=>{})};rx.appendChild(dl)}
  body.appendChild(rx);row.append(a,body);m.appendChild(row)});
 m.scrollTop=m.scrollHeight}
function render(){renderRail();renderChs();$("chtitle").textContent="# "+st.ch;
 const inp=$("in");inp.disabled=!db||!canPost();$("att").disabled=inp.disabled;inp.placeholder=db&&!canPost()?"Only certain roles can post in #"+st.ch+". You can still read and react.":"Message #"+st.ch;
 renderMsgs();const av=$("meav");
 $("onl").textContent=db?"· "+Object.keys(OL).filter(online).length+" online":"";setAv(av,uid);
 $("mename").textContent=uid?pname(uid):"Guest";$("mestat").textContent=(uid&&prof(uid).status)||(db?"Online":"Offline");applySet()}
function watch(){if(!db)return;if(unsub)unsub();M=[];pinsOnly=false;showMem=false;pal=null;$("bpin").classList.remove("on");$("bmem").classList.remove("on");
 unsub=db.collection("rooms").doc(st.srv+"_"+st.ch).collection("msgs").orderBy("t","desc").limit(100).onSnapshot(sn=>{M=sn.docs.map(d=>Object.assign({id:d.id},d.data())).reverse();renderMsgs()},e=>{M=[];renderMsgs()})}
function note(t){$("msgs").appendChild(el("div","empty",t))}
const SC={":fire:":"🔥",":heart:":"❤️",":smile:":"😄",":lol:":"😂",":cry:":"😭",":party:":"🎉",":eyes:":"👀",":thumbsup:":"👍",":cool:":"😎",":skull:":"💀",":100:":"💯",":gg:":"🏆"};
function prep(v){v=v.replace(/:[a-z0-9]+:/gi,m=>SC[m.toLowerCase()]||m);
 if(v==="/shrug")return"¯\\_(ツ)_/¯";if(v==="/flip")return"🪙 "+(Math.random()<.5?"Heads":"Tails");

  if(k.startsWith("**"))e=el("b",null,k.slice(2,-2));else if(k[0]==="*")e=el("i",null,k.slice(1,-1));else if(k[0]==="`")e=el("code",null,k.slice(1,-1));
